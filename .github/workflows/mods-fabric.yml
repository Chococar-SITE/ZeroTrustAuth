name: Mods · Fabric

# Fabric 載入器建置（MC 26.1.2 / Loom no-remap 1.16-SNAPSHOT / Java 25 / Gradle 9.4 wrapper）。
# 重型工具鏈（Loom 反編譯 Minecraft），與主 build 隔離；CI 才有開放網路抓取 fabric/mojang maven。
#
# 觸發採「路徑分流」：只在 Fabric 自身（platform-fabric / client-fabric）或**共用模組**
# （core / platform-common / client-core / settings.gradle.kts / gradle.properties）變動時才跑，
# 避免每次 commit 都重跑全部載入器。共用模組變動會同時觸發 Fabric / NeoForge / Forge 三個工作流。
on:
  push:
    branches: [ main, "claude/**" ]
    paths:
      - 'platform-fabric/**'
      - 'client-fabric/**'
      - 'core/**'
      - 'platform-common/**'
      - 'client-core/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/mods-fabric.yml'
  pull_request:
    paths:
      - 'platform-fabric/**'
      - 'client-fabric/**'
      - 'core/**'
      - 'platform-common/**'
      - 'client-core/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/mods-fabric.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mods-fabric-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fabric:
    name: Build fabric (MC 26.1.2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      # JDK 25：現代載入器 toolchain（Fabric @ 26.1.2）；JDK 21：core/platform-common/client-core（→ Java 17 位元碼）。
      - name: Set up JDK 21 + 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build platform-fabric + client-fabric
        run: ./gradlew :platform-fabric:build :client-fabric:build --no-daemon --stacktrace -PztLoader=fabric

      - name: Upload mod jars (server + client)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: zerotrustauth-fabric
          path: |
            platform-fabric/build/libs/*.jar
            client-fabric/build/libs/*.jar
          if-no-files-found: warn
