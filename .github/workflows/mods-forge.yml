name: Mods · Forge (legacy)

# Forge 舊版線建置。ForgeGradle 無法跑 repo wrapper 的 Gradle 9.4，故此工作流以 setup-gradle
# 釘選的 Gradle 8.x 之 `gradle`（非 ./gradlew）建置；Forge 不依賴 platform-paper，settings 於
# ztLoader=forge 時排除之（避免 Gradle 8 解析 platform-paper 的 JavaVersion.VERSION_25 失敗）。
#
# 觸發採「路徑分流」：只在 Forge 自身（platform-forge / client-forge）或**共用模組**
# （core / platform-common / client-core / settings.gradle.kts / gradle.properties）變動時才跑。
on:
  push:
    branches: [ main, "claude/**" ]
    paths:
      - 'platform-forge/**'
      - 'client-forge/**'
      - 'core/**'
      - 'platform-common/**'
      - 'client-core/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/mods-forge.yml'
  pull_request:
    paths:
      - 'platform-forge/**'
      - 'client-forge/**'
      - 'core/**'
      - 'platform-common/**'
      - 'client-core/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/mods-forge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mods-forge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forge:
    name: Build forge ${{ matrix.mc }} (pinned Gradle 8)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Forge 舊版線——分階段逐版推進（newest→oldest）。目前 CI 綠：1.20.1、1.19.4
        #（現代 Java-17 世代，ForgeGradle 6 / Gradle 8.10.2，共用 adapter 源碼 + CommandFeedback 墊片）。
        # 1.18.2：工具鏈已驗證可行（FG6/Gradle8 + Forge 1.18.2-40.2.0），惟其源碼需 per-era adapter
        #（Component.literal→TextComponent、BlockEvent event.world、getEntity Entity/Player…）——
        # 詳見 docs/forge-legacy-port.md。完成 adapter 後把 "1.18.2" 加回此 matrix 即可（build 設定已備妥）。
        # 更舊世代：1.16.5（Java8/FG5.1/Gradle7）→ 1.12.2 → 1.8.9 → 1.7.10（規劃用 GTNHGradle/RetroFuturaGradle）。
        mc: [ "1.20.1", "1.19.4" ]
    steps:
      - uses: actions/checkout@v6

      # Forge（現代世代）需 JDK 17（ForgeGradle 反編譯 / 編譯）；core/platform-common/client-core toolchain 為 21。
      # 多版本安裝，最後者（17）成為 JAVA_HOME = Gradle 8 daemon JDK。
      - name: Set up JDK 21 + 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            17

      # 釘選 Gradle 8.10.2（ForgeGradle 6 相容），提供 `gradle` 指令；忽略 repo 的 9.4 wrapper。
      - name: Set up pinned Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Build platform-forge + client-forge (MC ${{ matrix.mc }})
        run: gradle :platform-forge:build :client-forge:build --no-daemon --stacktrace -PztLoader=forge -PforgeMc=${{ matrix.mc }}

      - name: Upload mod jars (server + client)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zerotrustauth-forge-${{ matrix.mc }}
          path: |
            platform-forge/build/libs/*.jar
            client-forge/build/libs/*.jar
          if-no-files-found: warn
