name: MC Server Test

# Boots a REAL Paper server with the freshly-built plugin and asserts it
# enables, passes its startup self-test, runs a console command, and logs no
# fatal errors. The Minecraft version is read from gradle.properties by the
# harness (ci/mc-server-test.sh) — it is NOT duplicated here.
#
# This complements build.yml (unit build/test) with an end-to-end runtime check
# that the shaded plugin jar actually loads and works on a live server.

# 路徑分流：此測試只啟動 Paper 外掛（platform-paper + core + harness），故僅在這些路徑變動時才跑，
# 避免每次 commit 都啟動真實伺服器（約 5 分鐘）。
on:
  push:
    branches: [ main, "claude/**" ]
    paths:
      - 'platform-paper/**'
      - 'core/**'
      - 'ci/mc-server-test.sh'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/mc-server-test.yml'
  pull_request:
    paths:
      - 'platform-paper/**'
      - 'core/**'
      - 'ci/mc-server-test.sh'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/mc-server-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mc-server-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mc-server-test:
    name: Paper server execution test
    runs-on: ubuntu-latest
    # Hard ceiling so a wedged server can never hang the queue. The harness has
    # its own (tighter) internal timeouts; this is the outer safety net.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Build ONLY the Paper plugin (shaded). Produces
      # platform-paper/build/libs/*.jar that the harness picks up.
      - name: Build plugin (shadowJar)
        run: ./gradlew :platform-paper:shadowJar --no-daemon --stacktrace

      - name: Make harness executable
        run: chmod +x ci/mc-server-test.sh

      # Downloads Paper (open internet on GitHub-hosted runners), boots it,
      # and runs all assertions. Fails the job on any failed assertion.
      - name: Run Minecraft server execution test
        run: ci/mc-server-test.sh

      # On failure, upload the server log (and the rest of the run dir, minus
      # the multi-MB Paper jar and world data) so failures are diagnosable.
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mc-server-test-logs
          path: |
            run-server/server.log
            run-server/logs/**
            run-server/plugins/ZeroTrustAuth/**
          if-no-files-found: warn
          retention-days: 7
