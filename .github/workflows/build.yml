name: Build

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 雙 JDK：JDK 25 跑 Gradle 9 daemon 並編譯現代模組（Paper 26.1，toolchain 25）；
      # JDK 21 供 core / platform-common / client-core 的 toolchain（輸出 release 17 位元碼）。
      # setup-java 多版本安裝：最後一個（25）成為預設 JAVA_HOME，兩者皆可被 Gradle toolchain 偵測。
      - name: Set up JDK 21 + 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build & test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload plugin artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ZeroTrustAuth-plugin
          path: platform-paper/build/libs/*.jar
          if-no-files-found: warn
