name: Mods

# 平台載入器建置——重型工具鏈（Loom / ModDevGradle / ForgeGradle 會反編譯 Minecraft），與主 build
# 隔離；CI 才有開放網路抓取其 maven。
# - 現代線：Fabric (Loom 1.16-SNAPSHOT) + NeoForge (ModDevGradle 2.0.141) @ MC 26.1 / Java 25，
#   以 repo wrapper（Gradle 9.4）的 ./gradlew 建置（matrix job `loader`）。
# - 舊版線：Forge 1.20.1（ForgeGradle 6）——無法跑 Gradle 9，故以**獨立 job + pinned Gradle 8.10.2**
#   的 `gradle` 建置（job `forge`）。
on:
  push:
    branches: [ main, "claude/**" ]
    paths:
      - 'core/**'
      - 'platform-common/**'
      - 'client-core/**'
      - 'platform-fabric/**'
      - 'platform-neoforge/**'
      - 'platform-forge/**'
      - 'client-fabric/**'
      - 'client-neoforge/**'
      - 'client-forge/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/mods.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loader:
    name: Build ${{ matrix.loader }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Forge（1.20.1）不在此——ForgeGradle 6 無法跑 Gradle 9；Round 3 以 pinned Gradle 8 加回。
          - { loader: fabric, module: platform-fabric, clientModule: client-fabric }
          - { loader: neoforge, module: platform-neoforge, clientModule: client-neoforge }
    steps:
      - uses: actions/checkout@v6

      # JDK 25：現代載入器 toolchain（Fabric/NeoForge @ 26.1）；JDK 21：core/platform-common/client-core。
      - name: Set up JDK 21 + 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build ${{ matrix.module }} + ${{ matrix.clientModule }}
        run: ./gradlew :${{ matrix.module }}:build :${{ matrix.clientModule }}:build --no-daemon --stacktrace -PztLoader=${{ matrix.loader }}

      - name: Upload mod jars (server + client)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zerotrustauth-${{ matrix.loader }}
          path: |
            ${{ matrix.module }}/build/libs/*.jar
            ${{ matrix.clientModule }}/build/libs/*.jar
          if-no-files-found: warn

  # ── Forge 舊版線（1.20.1）：獨立 job（pinned Gradle 8）──
  # ForgeGradle 6 無法跑 repo wrapper 的 Gradle 9.4，故此 job 以 setup-gradle 釘選的 Gradle 8.10.2
  # 之 `gradle`（非 ./gradlew）建置。Forge 不依賴 platform-paper；settings 於 ztLoader=forge 時排除之
  # （避免 Gradle 8 解析 platform-paper 的 JavaVersion.VERSION_25 而於設定階段失敗）。
  forge:
    name: Build forge (legacy 1.20.1, pinned Gradle 8)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      # Forge 1.20.1 需 JDK 17（ForgeGradle 反編譯 / 編譯）；core/platform-common/client-core toolchain 為 21。
      # 多版本安裝，最後者（17）成為 JAVA_HOME = Gradle 8 daemon JDK（與既有綠燈設定一致）。
      - name: Set up JDK 21 + 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            17

      # 釘選 Gradle 8.10.2（ForgeGradle 6 相容），提供 `gradle` 指令；忽略 repo 的 9.4 wrapper。
      - name: Set up pinned Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Build platform-forge + client-forge
        run: gradle :platform-forge:build :client-forge:build --no-daemon --stacktrace -PztLoader=forge

      - name: Upload mod jars (server + client)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zerotrustauth-forge
          path: |
            platform-forge/build/libs/*.jar
            client-forge/build/libs/*.jar
          if-no-files-found: warn
