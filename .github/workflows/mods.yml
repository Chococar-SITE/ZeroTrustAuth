name: Mods

# 平台載入器（Fabric / NeoForge）建置——重型工具鏈（Loom / ModDevGradle 會反編譯 Minecraft），
# 與主 build 隔離。每個載入器以獨立 matrix job 建置，CI 才有開放網路抓取其 maven。
# Fabric (Loom 1.15) 與 NeoForge (ModDevGradle 2.0.141) 已對齊 MC 26.1 / Java 25 / Gradle 9。
# Forge 舊版線（1.20.1, ForgeGradle 6）不在此矩陣——ForgeGradle 6 無法跑 Gradle 9，
# 將於 Round 3 以自有 pinned Gradle 8 job 加回。
on:
  push:
    branches: [ main, "claude/**" ]
    paths:
      - 'core/**'
      - 'platform-common/**'
      - 'client-core/**'
      - 'platform-fabric/**'
      - 'platform-neoforge/**'
      - 'platform-forge/**'
      - 'client-fabric/**'
      - 'client-neoforge/**'
      - 'client-forge/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/mods.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loader:
    name: Build ${{ matrix.loader }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Forge（1.20.1）不在此——ForgeGradle 6 無法跑 Gradle 9；Round 3 以 pinned Gradle 8 加回。
          - { loader: fabric, module: platform-fabric, clientModule: client-fabric }
          - { loader: neoforge, module: platform-neoforge, clientModule: client-neoforge }
    steps:
      - uses: actions/checkout@v6

      # JDK 25：現代載入器 toolchain（Fabric/NeoForge @ 26.1）；JDK 21：core/platform-common/client-core。
      - name: Set up JDK 21 + 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build ${{ matrix.module }} + ${{ matrix.clientModule }}
        run: ./gradlew :${{ matrix.module }}:build :${{ matrix.clientModule }}:build --no-daemon --stacktrace -PztLoader=${{ matrix.loader }}

      - name: Upload mod jars (server + client)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zerotrustauth-${{ matrix.loader }}
          path: |
            ${{ matrix.module }}/build/libs/*.jar
            ${{ matrix.clientModule }}/build/libs/*.jar
          if-no-files-found: warn
