name: Mods

# 平台載入器（Fabric / NeoForge）建置——重型工具鏈（Loom / ModDevGradle 會反編譯 Minecraft），
# 與主 build 隔離。每個載入器以獨立 matrix job 建置，CI 才有開放網路抓取其 maven。
# TODO(26.1 migration — Rounds 2–3): re-enable push/PR triggers once the loader
# modules are ported: Fabric (Loom 1.15) + NeoForge (ModDevGradle 2.0.141) to MC
# 26.1 / Java 25 / Gradle 9, and the legacy Forge 1.20.1 job is moved onto its own
# pinned Gradle 8 (ForgeGradle 6 does not run on Gradle 9). Manual-dispatch only
# meanwhile so the in-flight loader work does not red-flag every push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loader:
    name: Build ${{ matrix.loader }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { loader: fabric, module: platform-fabric, clientModule: client-fabric, java: '21' }
          - { loader: neoforge, module: platform-neoforge, clientModule: client-neoforge, java: '21' }
          - { loader: forge, module: platform-forge, clientModule: client-forge, java: '17' }
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build ${{ matrix.module }} + ${{ matrix.clientModule }}
        run: ./gradlew :${{ matrix.module }}:build :${{ matrix.clientModule }}:build --no-daemon --stacktrace -PztLoader=${{ matrix.loader }}

      - name: Upload mod jars (server + client)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zerotrustauth-${{ matrix.loader }}
          path: |
            ${{ matrix.module }}/build/libs/*.jar
            ${{ matrix.clientModule }}/build/libs/*.jar
          if-no-files-found: warn
