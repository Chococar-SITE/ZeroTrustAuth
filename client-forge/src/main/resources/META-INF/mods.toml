# ZeroTrustAuth Client (Option A) — MinecraftForge mod 中繼資料，**LEGACY 版本線**（Minecraft 1.19.2 / Forge 43.x）。
#
# ⚠️ 此檔為 Forge 專屬的 META-INF/mods.toml（非 NeoForge 的 META-INF/neoforge.mods.toml）。
#     1.19.2 的 Forge（43.x）使用傳統 mods.toml 檔名與結構。
#
# 客戶端 mod：跑在管理員的遊戲客戶端，自動簽署伺服器的 Ed25519 挑戰並印出可上傳的公鑰。
#
# ⚠️ 此檔不含任何秘密。私鑰永不離開本機；網路只傳簽名與（自願）公鑰。

# javafml 為 Forge 的 Java mod 載入器；loaderVersion 對應 Forge 43.x（1.19.2）的 FML 版本範圍。
modLoader = "javafml"
loaderVersion = "[43,)"

# 授權（佔位；實際以 repo 根目錄 LICENSE 為準）。
license = "All Rights Reserved"

# 問題回報走 SECURITY.md 私密管道，勿開公開 issue（見 CLAUDE.md）。
issueTrackerURL = "https://github.com/Chococar-SITE/ZeroTrustAuth/issues"

[[mods]]
modId = "zerotrustauthclient"
# 版本固定字面值，避免佔位符插值在不同 ForgeGradle 版本下行為不一致而導致建置失敗。
version = "0.1.0"
displayName = "ZeroTrustAuth Client (Option A)"
# 客戶端 mod：自動回應伺服器選項 A 挑戰（Ed25519 簽名），並提供 /ztclient pubkey 印出公鑰。
description = '''
Client-side companion mod for ZeroTrustAuth (Option A). Runs on the administrator's game client,
auto-signs the server's Ed25519 challenge with a locally-stored key (private key never leaves the
machine), and prints the uploadable public key via /ztclient pubkey. Never Trust, Always Verify.
'''
authors = "Chococar-SITE"

# 此 mod 僅需安裝於客戶端；連到未安裝本 mod 的伺服器時不應因 mod 清單比對而被拒（IGNORE 伺服器版本）。
displayTest = "IGNORE_SERVER_VERSION"

# ── 依賴宣告 ───────────────────────────────────────────────
# Forge 本體：限定 43.x（對應 Minecraft 1.19.2）。客戶端側。
[[dependencies.zerotrustauthclient]]
modId = "forge"
type = "required"
versionRange = "[43,)"
ordering = "NONE"
side = "CLIENT"

# Minecraft：限定 1.19.2（含）至 1.20（不含）。客戶端側。
[[dependencies.zerotrustauthclient]]
modId = "minecraft"
type = "required"
versionRange = "[1.19.2,1.20)"
ordering = "NONE"
side = "CLIENT"
