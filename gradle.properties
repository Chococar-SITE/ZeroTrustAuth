# ── Project coordinates ────────────────────────────────
group=com.chococar
version=0.1.0-SNAPSHOT

# ── Minecraft / platform versions ──────────────────────
# 集中管理；CI 的 Minecraft Server 測試亦讀取同一版本。
# 現代線（Paper/Fabric/NeoForge）對齊政策旗艦 = Minecraft 26.1（2026 春季 drop）。
# 26.1 需 Java 25 + Gradle 9.x；Forge 舊版線（1.20.1）維持自有 Gradle 8 工具鏈（見 settings/CI）。
minecraftVersion=26.1.2
# Paper 26.1 改用新版 build 式座標 io.papermc.paper:paper-api:<ver>.build.<n>
#（不再是 -R0.1-SNAPSHOT）；以動態 .+ 取該版最新 build。
paperApiVersion=26.1.2.build.+
jdaVersion=5.0.2
luckpermsApiVersion=5.4

# ── Gradle ─────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.caching=true
# 載入器（Loom / ModDevGradle）反編譯 Minecraft 需較多堆。
org.gradle.jvmargs=-Xmx4g
